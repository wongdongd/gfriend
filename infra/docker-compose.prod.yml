# 生产环境 docker-compose
# 用法: docker compose -f infra/docker-compose.prod.yml up -d
# 适合单台 VPS 部署（Hetzner/DigitalOcean 等）
#
# 注意：API 容器已内置 Celery Worker（entrypoint.sh 同时启动两者），
# 无需单独的 worker 服务。如需独立扩展 Worker，取消下方注释即可。
#
# 安全：生产环境不暴露数据库端口到宿主机，仅在 docker 网络内互通。

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    # 生产环境不暴露端口到宿主机
    environment:
      POSTGRES_USER: ${DB_USER:-companion}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-companion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-companion}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # 生产环境不暴露端口到宿主机
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-companion}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-companion}
      - DATABASE_SYNC_URL=postgresql://${DB_USER:-companion}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-companion}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-dummy}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 可选：独立 Worker（需要高并发图片/视频生成时启用）
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: infra/docker/backend.Dockerfile
  #   restart: always
  #   entrypoint: ["python", "main.py", "worker"]
  #   working_dir: /app
  #   environment:
  #     - CELERY_QUEUES=image,video,safety,celery
  #     - DATABASE_URL=postgresql+asyncpg://${DB_USER:-companion}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-companion}
  #     - REDIS_URL=redis://redis:6379/0
  #     - CELERY_BROKER_URL=redis://redis:6379/1
  #     - CELERY_RESULT_BACKEND=redis://redis:6379/2
  #     - LLM_PROVIDER=${LLM_PROVIDER:-openai}
  #     - LLM_API_KEY=${LLM_API_KEY}
  #     - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
  #     - IMAGE_PROVIDER=${IMAGE_PROVIDER:-dummy}
  #     - S3_ENDPOINT=${S3_ENDPOINT}
  #     - S3_BUCKET=${S3_BUCKET}
  #     - S3_ACCESS_KEY=${S3_ACCESS_KEY}
  #     - S3_SECRET_KEY=${S3_SECRET_KEY}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
  redis-data:
