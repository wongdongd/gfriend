# backend 项目配置（非可安装包，直接 python main.py 运行）
# 依赖见 requirements.txt，工具配置见下方各 [tool.*] 段

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["db/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "db", "companion_core", "provider_adapters", "api", "worker"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "db/alembic/versions/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
